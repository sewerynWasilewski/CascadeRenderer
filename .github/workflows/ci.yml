name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get install -y cmake ninja-build

      - name: Configure
        # GLFW_BUILD_WAYLAND=OFF: wayland-scanner is not available on the runner.
        # When tests require a real window (swapchain, surface creation), either install
        # libwayland-dev xorg-dev on the runner or switch to a headless Xvfb setup.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -G Ninja -DGLFW_BUILD_WAYLAND=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
