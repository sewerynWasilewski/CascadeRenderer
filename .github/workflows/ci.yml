name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libvulkan-dev libxkbcommon-dev libwayland-dev wayland-protocols extra-cmake-modules libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Configure
        # GLFW Wayland and X11 disabled: no display server available on the runner and
        # tests don't create windows. When tests require a real surface (swapchain tests),
        # install libwayland-dev xorg-dev on the runner or switch to a headless Xvfb setup.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -G Ninja -DGLFW_BUILD_WAYLAND=OFF -DGLFW_BUILD_X11=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
